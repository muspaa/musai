<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f0">
<title>BLACKBOX AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f0;--white:#fff;--ink:#111;--line:2px solid #111;--green:#b7ff75}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",sans-serif;min-height:100dvh}
button,textarea{font:inherit}button{cursor:pointer;color:inherit}
.app{min-height:100dvh;max-width:1000px;margin:auto;padding:0 15px;display:flex;flex-direction:column}
header{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.7px}
.brand-icon{width:34px;height:34px;display:grid;place-items:center;background:#111;color:white;border-radius:8px;font-size:20px}
.actions{display:flex;gap:8px}.icon{height:38px;min-width:40px;border:var(--line);border-radius:8px;background:white;box-shadow:3px 3px #111;font-weight:700}
.icon:active,.suggestion:active,.send:active{transform:translate(3px,3px);box-shadow:none}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.chat{flex:1;overflow-y:auto;padding:20px 0 24px;overscroll-behavior:contain}
.welcome{max-width:560px;text-align:center;margin:8vh auto 30px}
.hero{height:68px;width:68px;margin:0 auto 20px;background:var(--green);border:var(--line);border-radius:15px;box-shadow:4px 4px #111;display:grid;place-items:center;font-size:30px;transform:rotate(-4deg)}
h1{font-size:clamp(34px,8vw,54px);letter-spacing:-3px;line-height:1;margin:0 0 14px}
.welcome p{font-size:14px;line-height:1.7;color:#555;max-width:390px;margin:auto}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:26px auto 0;max-width:520px}
.suggestion{background:white;border:var(--line);border-radius:10px;box-shadow:3px 3px #111;text-align:left;padding:12px;min-height:76px;font-size:13px;font-weight:600}
.suggestion span{display:block;font-size:19px;margin-bottom:6px}
.messages{max-width:740px;width:100%;margin:auto;display:flex;flex-direction:column;gap:22px}
.message{display:flex;gap:10px;align-items:flex-start}.message.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;flex-shrink:0;display:grid;place-items:center;border:var(--line);border-radius:9px;background:var(--green);font-weight:700}
.user .avatar{background:#111;color:white}
.message-content{max-width:min(88%,620px);min-width:0}.label{font:10px "DM Mono",monospace;letter-spacing:1px;color:#777;margin:0 0 7px}.user .label{text-align:right}
.bubble{border:var(--line);border-radius:4px 13px 13px 13px;padding:12px 14px;background:white;box-shadow:3px 3px #111;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.user .bubble{background:var(--green);border-radius:13px 4px 13px 13px}
.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}.bubble pre{background:#171717;color:#f5f5f5;border-radius:8px;padding:12px;overflow-x:auto;font:12px/1.7 "DM Mono",monospace}.bubble code{font-family:"DM Mono",monospace}.bubble :not(pre)>code{background:#eee;padding:2px 4px;border-radius:4px}
.tools{margin-top:7px}.tool{background:transparent;border:1px solid #aaa;border-radius:6px;padding:5px 9px;font-size:11px}
.typing{display:flex;gap:5px;padding:5px}.typing i{width:7px;height:7px;background:#111;border-radius:50%;animation:b .7s infinite alternate}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{to{opacity:.3;transform:translateY(-5px)}}
.composer-wrap{position:sticky;bottom:0;background:var(--bg);padding:10px 0 max(13px,env(safe-area-inset-bottom));}
.composer{max-width:740px;margin:auto;display:flex;align-items:flex-end;gap:8px;padding:8px;border:var(--line);background:white;border-radius:13px;box-shadow:4px 4px #111}
textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;padding:10px 5px;min-height:42px;max-height:150px;font-size:16px;line-height:1.5}
textarea::placeholder{color:#999}.send{width:43px;height:43px;flex-shrink:0;border:var(--line);border-radius:9px;background:#111;color:white;font-size:20px;font-weight:700}.send:disabled{opacity:.45}
.meta{max-width:740px;margin:9px auto 0;display:flex;justify-content:space-between;gap:8px;color:#777;font:10px "DM Mono",monospace}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#62b832;margin-right:6px}
@media(max-width:600px){.app{padding:0 12px}header{height:59px}.chat{padding-top:12px}.welcome{margin:9vh auto 24px}.welcome p{font-size:13px;padding:0 8px}.suggestions{gap:9px;margin-top:23px}.suggestion{min-height:80px;padding:10px;font-size:12px}.message{gap:8px}.avatar{width:29px;height:29px}.message-content{max-width:89%}.bubble{font-size:13.5px;padding:11px 12px}.composer{padding:7px;gap:5px;box-shadow:3px 3px #111}.meta{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="brand-icon">✳</div>BLACKBOX AI</div><div class="actions"><button class="icon" id="newChat" aria-label="Chat baru">＋</button><button class="icon" id="clearChat" aria-label="Hapus chat">⌫</button></div></header>
<main><section class="chat" id="chatArea">
<div class="welcome" id="welcome"><div class="hero">✳</div><h1>Think less.<br>Build more.</h1><p>Asisten AI untuk ide, coding, produktivitas, dan semua hal yang ingin kamu eksplorasi.</p>
<div class="suggestions">
<button class="suggestion" data-prompt="Buatkan website portfolio modern menggunakan HTML CSS dan JavaScript"><span>⌘</span>Buat website</button>
<button class="suggestion" data-prompt="Jelaskan konsep API dengan contoh sederhana"><span>⚡</span>Jelaskan konsep</button>
<button class="suggestion" data-prompt="Bantu saya mencari ide project aplikasi yang menarik"><span>✦</span>Cari ide project</button>
<button class="suggestion" data-prompt="Buatkan script JavaScript yang berguna untuk automasi"><span>⌁</span>Generate code</button>
</div></div><div class="messages" id="messages"></div>
</section>
<div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="prompt" rows="1" placeholder="Tulis sesuatu untuk AI..." aria-label="Pesan untuk AI"></textarea><button class="send" id="sendBtn" type="submit" aria-label="Kirim">↑</button></form><div class="meta"><span class="status">OVERCHAT • GPT-4o</span><span>ENTER UNTUK KIRIM</span></div></div>
</main></div>
<script>
"use strict";
const CONFIG={endpoint:"/api/chat"};
const $=s=>document.querySelector(s);
const chatArea=$("#chatArea"),messagesEl=$("#messages"),welcomeEl=$("#welcome"),promptEl=$("#prompt"),sendBtn=$("#sendBtn"),chatForm=$("#chatForm");
let conversation=[],isGenerating=false,abortController=null;
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function renderMarkdown(text){
 let s=escapeHTML(text),blocks=[];
 s=s.replace(/```([\w-]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{blocks.push(`<pre><code>${code.trim()}</code></pre>`);return `%%BLOCK${blocks.length-1}%%`;});
 s=s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/\n/g,"<br>");
 return s.replace(/%%BLOCK(\d+)%%/g,(_,i)=>blocks[+i]);
}
function scrollBottom(){requestAnimationFrame(()=>chatArea.scrollTop=chatArea.scrollHeight);}
function createMessage(role,content=""){
 const user=role==="user",el=document.createElement("article");el.className=`message ${role}`;
 const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=user?"U":"✳";
 const wrap=document.createElement("div");wrap.className="message-content";
 const label=document.createElement("div");label.className="label";label.textContent=user?"YOU":"BLACKBOX AI";
 const bubble=document.createElement("div");bubble.className="bubble";bubble.innerHTML=renderMarkdown(content);
 wrap.append(label,bubble);el.append(avatar,wrap);messagesEl.append(el);scrollBottom();return{el,bubble,wrap};
}
function addCopyButton(wrap,text){const tools=document.createElement("div");tools.className="tools";const b=document.createElement("button");b.className="tool";b.textContent="Salin";b.onclick=async()=>{try{await navigator.clipboard.writeText(text);b.textContent="Tersalin ✓";setTimeout(()=>b.textContent="Salin",1400)}catch{b.textContent="Gagal"}};tools.append(b);wrap.append(tools);}
function buildPayload(){return{messages:conversation.map(m=>({role:m.role,content:m.content}))};}
async function streamChat(onToken){
 abortController=new AbortController();
 const response=await fetch(CONFIG.endpoint,{method:"POST",signal:abortController.signal,headers:{"Content-Type":"application/json","Accept":"text/event-stream"},body:JSON.stringify(buildPayload())});
 if(!response.ok){const err=await response.json().catch(()=>({}));throw new Error(err.error||`HTTP ${response.status}`);}
 if(!response.body)throw new Error("Streaming tidak tersedia.");
 const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="",full="";
 while(true){const{done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split(/\r?\n/);buffer=lines.pop()||"";
 for(const line of lines){const t=line.trim();if(!t.startsWith("data:"))continue;const data=t.slice(5).trim();if(!data||data==="[DONE]")continue;try{const obj=JSON.parse(data),token=obj.choices?.[0]?.delta?.content;if(typeof token==="string"&&token){full+=token;onToken(full);}}catch{}}
 }
 return full.trim();
}
async function sendMessage(value){
 const text=value.trim();if(!text||isGenerating)return;
 welcomeEl.hidden=true;welcomeEl.style.display="none";
 conversation.push({role:"user",content:text});createMessage("user",text);
 promptEl.value="";resizeInput();isGenerating=true;sendBtn.disabled=true;sendBtn.textContent="…";
 const typing=createMessage("assistant");typing.bubble.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
 let output="";
 try{output=await streamChat(full=>{typing.bubble.innerHTML=renderMarkdown(full);scrollBottom();});
 if(!output)throw new Error("Respons AI kosong.");
 conversation.push({role:"assistant",content:output});typing.bubble.innerHTML=renderMarkdown(output);addCopyButton(typing.wrap,output);
 }catch(e){typing.bubble.textContent=e.name==="AbortError"?"Generasi dihentikan.":`Gagal: ${e.message}`;if(output)conversation.push({role:"assistant",content:output});}
 finally{isGenerating=false;abortController=null;sendBtn.disabled=false;sendBtn.textContent="↑";scrollBottom();}
}
function resizeInput(){promptEl.style.height="auto";promptEl.style.height=Math.min(promptEl.scrollHeight,150)+"px";}
promptEl.addEventListener("input",resizeInput);
promptEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();chatForm.requestSubmit();}});
chatForm.addEventListener("submit",e=>{e.preventDefault();sendMessage(promptEl.value);});
document.querySelectorAll(".suggestion").forEach(b=>b.addEventListener("click",()=>sendMessage(b.dataset.prompt)));
function resetChat(){if(abortController)abortController.abort();conversation=[];messagesEl.innerHTML="";welcomeEl.style.display="block";promptEl.value="";resizeInput();}
$("#newChat").addEventListener("click",resetChat);
$("#clearChat").addEventListener("click",()=>{if(conversation.length&&confirm("Hapus seluruh percakapan?"))resetChat();});
</script>
</body>
</html>
